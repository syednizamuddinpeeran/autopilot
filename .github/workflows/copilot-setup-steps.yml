# Prepares the Copilot cloud agent's sandbox before it starts work.
# The job MUST be named copilot-setup-steps.
name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/copilot-setup-steps.yml]
  pull_request:
    paths: [.github/workflows/copilot-setup-steps.yml]

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Uncomment the runtime(s) this project needs:
      # - uses: actions/setup-python@v6
      #   with: { python-version: "3.12" }
      # - uses: astral-sh/setup-uv@v6
      # - uses: actions/setup-node@v5
      #   with: { node-version: "22", cache: npm }
      # - uses: actions/setup-java@v5
      #   with: { distribution: temurin, java-version: "21" }

      - name: Ensure jq
        run: command -v jq || (sudo apt-get update && sudo apt-get install -y jq)

      - name: Project setup
        run: bash scripts/factory/setup.sh
