# Independent verification gate for every PR (human or agent).
# Make "verify" and "hooks-selftest" required status checks on the base branch.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # Mirror the runtime setup from copilot-setup-steps.yml here.
      - run: bash scripts/factory/setup.sh
      - run: bash scripts/factory/check.sh

  hooks-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/factory/test-hooks.sh

  guardrails-unchanged:
    # Fails if a PR from an agent branch touches guardrail files; a human must make those changes.
    if: startsWith(github.head_ref, 'copilot/') || startsWith(github.head_ref, 'agent/') || startsWith(github.head_ref, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Check protected paths
        run: |
          changed="$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")"
          echo "$changed"
          if echo "$changed" | grep -E '^(\.github/hooks/|\.github/workflows/|\.claude/|scripts/factory/(check(-ready)?\.(sh|ps1)|commands\.env))'; then
            echo "::error::Agent PR modifies guardrail files. A human must make these changes."
            exit 1
          fi
